<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Photo Validator</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f9f9f9;
      padding: 30px;
      text-align: center;
    }

    h1, h2 {
      color: #333;
    }

    form {
      margin: 20px auto;
      padding: 20px;
      border: 1px solid #ddd;
      background-color: #fff;
      border-radius: 8px;
      max-width: 400px;
    }

    input[type="file"],
    input[type="submit"] {
      margin: 10px 0;
      padding: 10px;
      width: 80%;
      font-size: 1em;
    }

    input[type="submit"] {
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    input[type="submit"]:hover {
      background-color: #0056b3;
    }

    ul {
      list-style: none;
      padding: 0;
      max-width: 500px;
      margin: 20px auto;
      text-align: left;
    }

    li {
      background-color: #fff;
      border: 1px solid #ddd;
      margin-bottom: 10px;
      padding: 10px;
      border-radius: 6px;
    }

    b {
      color: #555;
    }
  </style>
  
</head>
<body>
  <h1>Upload a Photo for Validation</h1>
  <form method="post" enctype="multipart/form-data">
    <input type="file" name="photo" required>
    <input type="submit" value="Validate">
  </form>
  {% if result %}
    <h2>Results:</h2>
    <ul>
      {% for key, value in result.items() %}
        <li><b>{{ key }}:</b> {{ value }}</li>
      {% endfor %}
    </ul>
  {% endif %}
</body>
</html>
